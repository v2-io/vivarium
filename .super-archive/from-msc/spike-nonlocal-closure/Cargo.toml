# Spike: the nonlinear closure for a NON-LOCAL flux.
#
# The open half of `#sketch-detail-abstract-reversion` FE(5): the erosion law
# does not commute with restriction (signed mean +5.34 m), and no LOCAL statistic
# predicts where (corr −0.027). This spike tests the hypothesis that the carrier
# is the DRAINAGE GRAPH — the non-local accumulation A — not local h-detail.
#
# Standalone `[workspace]` keeps it OUT of the parent workspace so it cannot
# perturb the main build. Path-depends on `vivarium-world` so every probe runs
# against the REAL fluvial kernel — never a toy re-implementation.
#
# Run:  cargo run --release --manifest-path msc/spike-nonlocal-closure/Cargo.toml
[package]
name = "spike-nonlocal-closure"
version = "0.0.0"
edition = "2021"
license = "MIT"

[workspace]

[dependencies]
vivarium-world = { path = "../../crates/vivarium-world" }

[profile.release]
opt-level = 3
