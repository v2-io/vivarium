# Spike: cross-face seam machinery — halo fill across a cube-face boundary
# (`form-cellid-chunk-patch` FE(4)) + a face-keyed flux as a real store citizen
# (`form-face-flux-register`).
#
# Standalone — its own `[workspace]` table keeps it OUT of the parent workspace,
# so it cannot perturb the main build for agents sharing this tree. It
# path-depends on `vivarium-world` so every probe runs against the REAL
# substrate (sphere, measure, store), never a toy re-implementation.
#
# Run:  cargo run --release --manifest-path msc/spike-cross-face-seam/Cargo.toml
[package]
name = "spike-cross-face-seam"
version = "0.0.0"
edition = "2021"
license = "MIT"

[workspace]

[dependencies]
vivarium-world = { path = "../../crates/vivarium-world" }

[profile.release]
opt-level = 3
